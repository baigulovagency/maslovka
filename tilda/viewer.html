<style>
  @font-face{font-family:'TTCommons';src:url('https://static.tildacdn.com/tild3565-3133-4465-b635-373139363838/TTCommons-Medium.woff') format('woff');font-weight:500;font-style:normal;font-display:swap}
  @font-face{font-family:'TTCommons';src:url('https://static.tildacdn.com/tild6433-6134-4232-a562-383065363338/TTCommons-DemiBold.woff') format('woff');font-weight:600;font-style:normal;font-display:swap}

  .mlv{
    --mlv-bg:#FAF7F2;      /* кремовый фон сайта */
    --mlv-ink:#3A3636;     /* основной тёмный */
    --mlv-accent:#899D54;  /* фирменный зелёный */
    --mlv-line:#E8E8E8;

    position:relative; width:100%; max-width:1200px; margin:0 auto;
    height:100vh; height:100dvh; background:var(--mlv-bg); overflow:hidden;
    font-family:'TTCommons',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    color:var(--mlv-ink);
  }
  @media screen and (max-width:640px){ .mlv{ max-width:none; } }

  .mlv-track{ display:flex; height:100%; overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .mlv-track::-webkit-scrollbar{ display:none; }

  .mlv-slide{ flex:0 0 100%; width:100%; height:100%; scroll-snap-align:center;
    display:flex; align-items:center; justify-content:center;
    padding:24px 104px 84px; box-sizing:border-box; }

  .mlv-slide img{ max-width:100%; max-height:100%; width:auto; height:auto;
    object-fit:contain; display:block; user-select:none; -webkit-user-drag:none;
    border-radius:4px; box-shadow:0 6px 28px rgba(58,54,54,.10); }

  /* ── стрелки: иконки с сайта ─────────────────────────── */
  .mlv-nav{ position:absolute; z-index:5;
    width:48px; height:48px; border:none; padding:0; cursor:pointer;
    background-color:transparent; background-repeat:no-repeat; background-size:48px 48px;
    transition:opacity .2s, transform .2s; }
  .mlv-nav:disabled{ opacity:0; pointer-events:none; }
  .mlv-prev{ background-image:url('https://static.tildacdn.com/tild3963-3732-4435-a463-396663353136/slide-left.svg'); }
  .mlv-next{ background-image:url('https://static.tildacdn.com/tild6436-3034-4464-a436-643434633363/slide-right.svg'); }

  /* десктоп: по бокам */
  @media screen and (min-width:641px){
    .mlv-nav{ top:50%; transform:translateY(-50%); }
    .mlv-nav:hover{ transform:translateY(-50%) scale(1.06); }
    .mlv-prev{ left:40px; }
    .mlv-next{ right:40px; }
  }

  /* ── нижняя панель / верхняя на мобиле ───────────────── */
  .mlv-bar{ position:absolute; left:50%; transform:translateX(-50%); z-index:5;
    display:flex; align-items:center; gap:14px;
    padding:8px 18px; border-radius:100px;
    background:#fff;
    white-space:nowrap; }
  .mlv-count{ font-size:13px; font-weight:600; letter-spacing:.06em;
    font-variant-numeric:tabular-nums; white-space:nowrap; flex:0 0 auto; }
  .mlv-dots{ display:flex; gap:7px; flex:0 0 auto; }
  .mlv-dot{ width:7px; height:7px; border-radius:50%; background:var(--mlv-line);
    border:none; padding:0; cursor:pointer; transition:background .25s, transform .25s; }
  .mlv-dot.is-on{ background:var(--mlv-accent); transform:scale(1.25); }

  @media screen and (min-width:641px){ .mlv-bar{ bottom:20px; } }

  /* мобильный: панель наверх, стрелки вниз */
  @media screen and (max-width:640px){
    .mlv-slide{ padding:70px 14px 78px; }
    .mlv-bar{ top:16px; }
    .mlv-nav{ bottom:18px; top:auto; transform:none; }
    .mlv-prev{ left:calc(50% - 52px); }
    .mlv-next{ left:calc(50% + 4px); }
  }
</style>

<div class="mlv" id="mlv">
  <div class="mlv-track" id="mlvTrack"></div>
  <button class="mlv-nav mlv-prev" id="mlvPrev" aria-label="Предыдущая страница" disabled></button>
  <button class="mlv-nav mlv-next" id="mlvNext" aria-label="Следующая страница"></button>
  <div class="mlv-bar">
    <span class="mlv-count" id="mlvCount">1&nbsp;/&nbsp;7</span>
    <span class="mlv-dots" id="mlvDots"></span>
  </div>
</div>

<script>
(function(){
  var USER='baigulovagency', REPO='maslovka', BRANCH='main';
  var BASE='https://cdn.jsdelivr.net/gh/'+USER+'/'+REPO+'@'+BRANCH+'/pages/';
  var FALLBACK_PAGES=7;

  var root=document.getElementById('mlv'), track=document.getElementById('mlvTrack'),
      prev=document.getElementById('mlvPrev'), next=document.getElementById('mlvNext'),
      count=document.getElementById('mlvCount'), dots=document.getElementById('mlvDots');
  var cur=0, PAGES=0;
  var NB='\u00A0';

  fetch(BASE+'pages.json',{cache:'no-cache'})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(m){ build(m.count); })
    .catch(function(){ build(FALLBACK_PAGES); });

  function label(n){ return n+NB+'/'+NB+PAGES; }

  function build(n){
    PAGES=n;
    for(var i=1;i<=PAGES;i++){
      var s=document.createElement('div'); s.className='mlv-slide';
      var im=document.createElement('img');
      im.src=BASE+('0'+i).slice(-2)+'.webp';
      im.alt='Страница '+i;
      im.loading=i<=2?'eager':'lazy';
      im.decoding='async';
      s.appendChild(im); track.appendChild(s);

      var d=document.createElement('button');
      d.className='mlv-dot'+(i===1?' is-on':'');
      d.setAttribute('aria-label','Страница '+i);
      (function(k){ d.addEventListener('click',function(){ go(k); }); })(i-1);
      dots.appendChild(d);
    }
    count.textContent=label(1);
    prev.disabled=true; next.disabled=(PAGES<2);
  }

  function go(n){
    n=Math.max(0,Math.min(PAGES-1,n));
    track.scrollTo({left:n*track.clientWidth, behavior:'smooth'});
  }
  function sync(){
    if(!PAGES) return;
    var n=Math.round(track.scrollLeft/track.clientWidth);
    if(n===cur) return;
    cur=n;
    count.textContent=label(n+1);
    [].forEach.call(dots.children,function(d,i){ d.classList.toggle('is-on',i===n); });
    prev.disabled=(n===0); next.disabled=(n===PAGES-1);
  }
  var tick;
  track.addEventListener('scroll',function(){ clearTimeout(tick); tick=setTimeout(sync,60); },{passive:true});
  prev.addEventListener('click',function(){ go(cur-1); });
  next.addEventListener('click',function(){ go(cur+1); });

  document.addEventListener('keydown',function(e){
    if(!root.getBoundingClientRect().height) return;
    if(e.key==='ArrowRight') go(cur+1);
    if(e.key==='ArrowLeft')  go(cur-1);
  });
  window.addEventListener('resize',function(){ track.scrollLeft=cur*track.clientWidth; });
})();
</script>
