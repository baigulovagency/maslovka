name: PDF -> страницы

on:
  push:
    paths:
      - '**.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pymupdf pillow

      - name: Рендер страниц
        run: python scripts/render.py

      - name: Коммит результата
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages
          if git diff --staged --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Пересобраны страницы презентации [skip ci]"
            git push
          fi
